# SENSAI configuration (contract CORE-03, PROJECT.md §7.3).
#
# Copy to config.toml (git-ignored) and adjust. Every key is optional: a missing
# key keeps the default value shown here. Unknown keys are rejected, so a typo
# fails loudly instead of being silently ignored.
#
# Priority, highest first:
#   1. CLI arguments          --model, --host, --config
#   2. Environment variables  SENSAI_<SECTION>_<KEY>, e.g. SENSAI_OLLAMA_MODEL=qwen3:8b
#                             (lists are comma-separated: SENSAI_HITL_DENY=a,b)
#                             SENSAI_CONFIG=path/to/config.toml selects the file
#   3. This file              ./config.toml by default
#   4. Built-in defaults      identical to the values below

[ollama]
host = "http://localhost:11434"
model = "qwen3:8b"            # indicative, chosen by benchmark (CORE-12)
judge_model = ""               # empty = same model as the agent
timeout_s = 120
keep_alive = "30m"
num_ctx = 8192                 # 2048 to 32768

[agent]
temperature = 0.1              # 0 to 1
max_tool_iterations = 6
max_result_rows = 50           # rows of a tool result sent to the model
max_result_chars = 8000        # characters of a tool result sent to the model
max_sql_retries = 2
language = "fr"
max_questions_per_turn = 1     # clarifying questions (ask_user) per turn; 0 = never ask
question_timeout_s = 120       # without an answer, the agent makes an explicit assumption
prompt_version = "v1"          # system prompt version (src/sensai/core/prompts/registry.toml)

[database]
business_path = "data/business.db"
memory_path = "data/memory.db"
row_limit = 200
query_timeout_ms = 5000

[hitl]
confirmation_timeout_s = 120
always_confirm = []            # tool names that always require confirmation
deny = []                      # tool names that are always refused

[eval]
judge_enabled = true
numeric_tolerance = 0.01       # 1 %

[fewshot]                       # dynamic examples: closest question -> SQL pairs in the prompt
enabled = true
k = 3                           # examples injected at most
min_score = 0.0                 # minimal bm25 score (0 = always the k best)

[documents]                     # committee note written section by section by the agent
template = "note_comite"

# MCP servers started at launch. Adding a [mcp.servers.<name>] table is enough to
# plug in a new server. <name> always prefixes its tools (time__get_current_time);
# native tools (memory) are never prefixed.
# sql_toolbox reads [database] business_path, row_limit and query_timeout_ms: no --db here
[mcp.servers.sql_toolbox]
command = "python"
args = ["-m", "sensai.mcp_servers.sql_toolbox"]

[mcp.servers.time]
command = "uvx"
args = ["mcp-server-time", "--local-timezone=Europe/Paris"]

# [mcp.servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "./reports"]

[files]                         # file tools: nothing is reachable outside the roots below
max_read_bytes = 200000
write_extensions = [".md", ".csv", ".json", ".txt"]
deny = [".env", "config.toml", "*.db", "*.sqlite", "*.key", "*.pem"]   # always refused, even under a root

[[files.roots]]
path = "reports"                # relative to the launch directory
mode = "rw"

[[files.roots]]
path = "data/imports"
mode = "r"

[web]
host = "127.0.0.1"
port = 8000

# Act 3 of the demo (CORE-20): with alter_answer = true, for a question that contains
# alter_trigger, a figure of the answer is raised by 15 % before the judge, which is
# not told. The CLI and the web server say "Mode démo actif" at startup: tell the jury.
[demo]
alter_answer = false
alter_trigger = "Brasserie Lemaire"
